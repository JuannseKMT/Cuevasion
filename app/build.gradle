plugins {
    id 'com.android.application'
}

android {
    namespace 'app.cuevision'
    compileSdk 36

    defaultConfig {
        applicationId "app.cuevision"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../cuevision.jks")
            storePassword "3017881832"
            keyAlias "cuevision"
            keyPassword "3017881832"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}